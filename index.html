<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>函数图绘制器</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.25.4/dist/function-plot.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --border: rgba(11, 11, 11, 0.10);
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --accent: #2a78d6;
    --danger: #d03b3b;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --border: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --accent: #3987e5;
      --danger: #e66767;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--page);
    color: var(--text);
  }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .app-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .app-header h1 { font-size: 20px; font-weight: 700; }
  .app-header .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .layout {
    flex: 1;
    display: flex;
    gap: 20px;
    padding: 20px 24px;
    align-items: flex-start;
  }
  .panel {
    width: 304px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .control h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--axis);
    border-radius: 8px;
    background: var(--page);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .input-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button { font-family: inherit; cursor: pointer; }
  .add-btn {
    padding: 8px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; line-height: 1.4; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .presets button {
    padding: 7px 4px;
    border: 1px solid var(--axis);
    border-radius: 8px;
    background: var(--page);
    color: var(--text-2);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .presets button:hover { border-color: var(--accent); color: var(--accent); }
  .fn-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .fn-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--page);
  }
  .fn-list li.empty { justify-content: center; color: var(--muted); border-style: dashed; font-size: 13px; }
  .fn-list .swatch {
    width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
  }
  .fn-list .fn-name {
    flex: 1; min-width: 0;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fn-list .del {
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 13px; line-height: 1;
    flex-shrink: 0;
  }
  .fn-list .del:hover { background: var(--danger); color: #fff; }
  .range-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .range-row label { width: 34px; flex-shrink: 0; font-size: 13px; color: var(--text-2); }
  .range-row input {
    flex: 1; min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--axis);
    border-radius: 6px;
    background: var(--page);
    color: var(--text);
    font-size: 13px;
  }
  .range-row span { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .ghost-btn {
    width: 100%;
    padding: 8px;
    margin-top: 2px;
    border: 1px solid var(--axis);
    border-radius: 8px;
    background: var(--page);
    color: var(--text-2);
    font-size: 13px;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .plot-wrap {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #plot { width: 100%; }
  #plot .empty {
    height: 480px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  .plot-wrap svg { display: block; }
  /* 网格线 = 坐标轴刻度延伸线（function-plot 1.25 结构） */
  .plot-wrap .axis .tick line { stroke: var(--grid); opacity: 1; }
  .plot-wrap .axis .domain { stroke: var(--axis); }
  .plot-wrap .axis .tick text { fill: var(--muted); font-size: 11px; }
  /* 原点处的主轴线（x=0、y=0），即 x/y 轴本体：加深加粗以区别于网格线 */
  .plot-wrap .origin { stroke: var(--text-2); stroke-width: 1.5; opacity: 1; }
  /* 坐标轴名称 x / y */
  .plot-wrap .axis-label { fill: var(--text-2); font-size: 15px; font-weight: 600; font-style: italic; }
  /* 函数曲线 */
  .plot-wrap path.line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 坐标提示 */
  .plot-wrap .tip path, .plot-wrap .tip line { stroke: var(--muted); stroke-dasharray: 4 3; }
  .plot-wrap .tip rect { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
  .plot-wrap .tip text { fill: var(--text); font-size: 11px; font-family: inherit; }
  @media (max-width: 880px) {
    .layout { flex-direction: column; align-items: stretch; }
    .panel { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>函数图绘制器</h1>
    <p class="hint">支持 sin cos tan ln log sqrt abs 等 · 欧拉常数 e 或 E（如 e^x）· 乘号可省略（2x）· 滚轮缩放 · 拖拽平移</p>
  </header>
  <div class="layout">
    <aside class="panel">
      <section class="control">
        <h2>添加函数</h2>
        <div class="input-row">
          <input id="fn-input" type="text" placeholder="例如 x^2、sin(x)、E^x、ln(x)" aria-label="函数表达式" />
          <button id="add-btn" class="add-btn" type="button">添加</button>
        </div>
        <div id="error" class="error" role="alert"></div>
      </section>
      <section class="control">
        <h2>快速添加</h2>
        <div id="presets" class="presets"></div>
      </section>
      <section class="control">
        <h2>已添加函数</h2>
        <ul id="fn-list" class="fn-list"></ul>
      </section>
      <section class="control">
        <h2>坐标范围</h2>
        <div class="range-row">
          <label for="x-min">X</label>
          <input id="x-min" type="number" step="any" value="-10" aria-label="X 轴最小值" />
          <span>到</span>
          <input id="x-max" type="number" step="any" value="10" aria-label="X 轴最大值" />
        </div>
        <div class="range-row">
          <label for="y-min">Y</label>
          <input id="y-min" type="number" step="any" value="-10" aria-label="Y 轴最小值" />
          <span>到</span>
          <input id="y-max" type="number" step="any" value="10" aria-label="Y 轴最大值" />
        </div>
        <button id="reset-btn" class="ghost-btn" type="button">重置视图</button>
      </section>
    </aside>
    <main class="plot-wrap">
      <div id="plot"></div>
    </main>
  </div>
</div>

<script>
(function () {
  'use strict';

  const plotEl = document.getElementById('plot');

  if (typeof functionPlot === 'undefined') {
    plotEl.innerHTML = '<div class="empty">无法加载绘图库，请检查网络连接（页面依赖 CDN）。</div>';
    return;
  }

  const fnInput = document.getElementById('fn-input');
  const addBtn = document.getElementById('add-btn');
  const errorEl = document.getElementById('error');
  const listEl = document.getElementById('fn-list');
  const xMinEl = document.getElementById('x-min');
  const xMaxEl = document.getElementById('x-max');
  const yMinEl = document.getElementById('y-min');
  const yMaxEl = document.getElementById('y-max');
  const resetBtn = document.getElementById('reset-btn');
  const presetsEl = document.getElementById('presets');

  const DEFAULT_DOMAIN = [-10, 10];
  const PRESETS = ['x^2', 'x^3', 'sin(x)', 'cos(x)', 'tan(x)', 'E^x', 'ln(x)', 'sqrt(x)', 'abs(x)', '1/x'];

  let functions = [];
  let xDomain = DEFAULT_DOMAIN.slice();
  let yDomain = DEFAULT_DOMAIN.slice();
  let colorCursor = 0;
  let plotInstance = null;
  let resizeTimer = null;

  function palette() {
    const cs = getComputedStyle(document.documentElement);
    const out = [];
    for (let i = 1; i <= 8; i++) out.push(cs.getPropertyValue('--series-' + i).trim());
    return out;
  }

  function nextColor() {
    const p = palette();
    return p[colorCursor++ % p.length];
  }

  function isValid(expr) {
    // 用足够大的画布做一次试渲染：10×10 太小不会触发表达式求值，
    // 解析错误（如 sin(、x^^2）此时不抛错，必须用正常尺寸。
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(tmp);
    try {
      functionPlot({ target: tmp, width: 200, height: 200, data: [{ fn: expr, graphType: 'polyline', sampler: 'builtIn' }] });
      return true;
    } catch (e) {
      return false;
    } finally {
      tmp.remove();
    }
  }

  function render() {
    const w = plotEl.clientWidth || 800;
    const h = Math.max(420, Math.min(640, Math.round(w * 0.62)));
    plotEl.innerHTML = '';
    if (!functions.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '尚未添加函数，请在左侧输入表达式';
      plotEl.appendChild(empty);
      plotInstance = null;
      return;
    }
    plotInstance = functionPlot({
      target: '#plot',
      width: w,
      height: h,
      grid: true,
      zoom: { enable: true },
      tip: { xLine: true, yLine: true },
      xAxis: { domain: xDomain.slice(), label: 'x' },
      yAxis: { domain: yDomain.slice(), label: 'y' },
      data: functions.map(function (f) {
        // graphType 必须用 polyline + builtIn 数值采样：function-plot 1.25.4 的
        // interval 采样器对指数含变量的幂（E^x、2^x、x^x…）会返回空区间，
        // 导致整条曲线不显示（这是该版本的库 bug）。
        return { fn: f.fn, color: f.color, lineWidth: 2, graphType: 'polyline', sampler: 'builtIn' };
      })
    });
    // 缩放/平移实际应用后同步范围输入框：
    // 滚轮缩放有 ~150ms 防抖，wheel 事件本身读取的是旧域，不能依赖它；
    // 需挂在 d3-zoom 的 behavior 上（d3-dispatch 派发 'zoom' 的唯一通道）
    if (plotInstance.meta && plotInstance.meta.zoomBehavior) {
      plotInstance.meta.zoomBehavior.on('zoom.sync', syncDomains);
    }
  }

  function updateList() {
    listEl.innerHTML = '';
    if (!functions.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '暂无曲线';
      listEl.appendChild(li);
      return;
    }
    functions.forEach(function (f, idx) {
      const li = document.createElement('li');
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = f.color;
      const name = document.createElement('span');
      name.className = 'fn-name';
      name.textContent = f.fn;
      name.title = f.fn;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.type = 'button';
      del.setAttribute('aria-label', '删除 ' + f.fn);
      del.addEventListener('click', function () {
        functions.splice(idx, 1);
        updateList();
        render();
      });
      li.appendChild(swatch);
      li.appendChild(name);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  function normalizeExpr(expr) {
    // 欧拉常数：解析器（math-codegen）认大写 E（Math.E），小写 e 是未定义符号会报错。
    // 把表达式中独立的 e 统一替换成 E，这样 e^x 与 E^x 都能正常绘制。
    return expr.replace(/\be\b/g, 'E');
  }

  function addFunction(raw) {
    const expr = normalizeExpr((raw || '').trim().replace(/\s+/g, ''));
    if (!expr) return;
    if (!isValid(expr)) {
      errorEl.textContent = '无法解析「' + expr + '」，请检查语法（示例：x^2、sin(x)、E^x）';
      fnInput.focus();
      return;
    }
    errorEl.textContent = '';
    functions.push({ fn: expr, color: nextColor() });
    fnInput.value = '';
    updateList();
    render();
  }

  // 预置按钮
  PRESETS.forEach(function (fn) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.fn = fn;
    b.textContent = fn;
    b.addEventListener('click', function () { addFunction(b.dataset.fn); });
    presetsEl.appendChild(b);
  });

  // 输入与添加
  addBtn.addEventListener('click', function () { addFunction(fnInput.value); });
  fnInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addFunction(fnInput.value);
  });

  // 坐标范围
  function readDomains() {
    const x0 = parseFloat(xMinEl.value), x1 = parseFloat(xMaxEl.value);
    const y0 = parseFloat(yMinEl.value), y1 = parseFloat(yMaxEl.value);
    if (isFinite(x0) && isFinite(x1) && x0 !== x1) xDomain = [x0, x1];
    if (isFinite(y0) && isFinite(y1) && y0 !== y1) yDomain = [y0, y1];
  }
  [xMinEl, xMaxEl, yMinEl, yMaxEl].forEach(function (el) {
    el.addEventListener('change', function () { readDomains(); render(); });
  });
  resetBtn.addEventListener('click', function () {
    xDomain = DEFAULT_DOMAIN.slice();
    yDomain = DEFAULT_DOMAIN.slice();
    xMinEl.value = DEFAULT_DOMAIN[0];
    xMaxEl.value = DEFAULT_DOMAIN[1];
    yMinEl.value = DEFAULT_DOMAIN[0];
    yMaxEl.value = DEFAULT_DOMAIN[1];
    render();
  });

  // 缩放/平移后同步坐标范围输入框
  function round2(v) { return Math.round(v * 100) / 100; }
  function syncDomains() {
    if (!plotInstance || !plotInstance.meta) return;
    try {
      // 缩放/平移后 meta.xDomain 不会更新，需从 scale 读取当前域
      const xd = plotInstance.meta.xScale.domain();
      const yd = plotInstance.meta.yScale.domain();
      if (Array.isArray(xd) && xd.length === 2 && isFinite(xd[0]) && isFinite(xd[1])) {
        xDomain = [xd[0], xd[1]];
        xMinEl.value = round2(xd[0]);
        xMaxEl.value = round2(xd[1]);
      }
      if (Array.isArray(yd) && yd.length === 2 && isFinite(yd[0]) && isFinite(yd[1])) {
        yDomain = [yd[0], yd[1]];
        yMinEl.value = round2(yd[0]);
        yMaxEl.value = round2(yd[1]);
      }
    } catch (e) { /* 忽略同步失败 */ }
  }

  // 响应式
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    }).observe(plotEl);
  } else {
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    });
  }

  // 主题切换时按索引重新分配曲线颜色
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    const p = palette();
    functions.forEach(function (f, i) { f.color = p[i % p.length]; });
    render();
  });

  // 初始演示曲线
  addFunction('x^2');
})();
</script>
</body>
</html>
